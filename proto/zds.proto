syntax = "proto3";

// GRPC package - part of the URL. Service is added.
// URL: /PACKAGE.SERVICE/METHOD
package istio.workload.zds;

option go_package="pkg/zdsapi";

enum Version {
  NOT_USED = 0;
  V1 = 1;
}

// Optional protocol features. ztunnel lists the ones it supports in ZdsHello; the CNI agent
// must not send a message a feature introduces unless ztunnel advertised that feature.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // ztunnel understands DrainWorkload.
  DRAIN_WORKLOAD = 1;
}

message ZdsHello {
  Version version = 1;
  repeated Capability capabilities = 2;
}

message WorkloadInfo {
  reserved "trust_domain"; // Deprecated
  reserved 4;
  string name = 1;
  string namespace = 2;
  string service_account = 3;
}

// Add a workload to the ztunnel. This will be accompanied by ancillary data containing
// the workload's netns file descriptor.
message AddWorkload {
  string uid = 1;
  WorkloadInfo workload_info = 2;
}

// Keep workload that we can't find in the fd cache. This can only be sent before SnapshotSent is sent
// to signal ztunnel to not delete the workload if it has it.
message KeepWorkload {
  string uid = 1;
}

// Delete a workload from the ztunnel. Ztunnel should shutdown the workload's proxy.
message DelWorkload {
  string uid = 2;
}

// Drain a workload's inbound HBONE traffic, typically because it is terminating. Ztunnel sends a
// graceful GOAWAY on every inbound HBONE connection to the workload, both those open when the
// message arrives and any accepted afterwards. Streams already running keep running. A new stream
// (CONNECT) whose client marked it as retriable elsewhere (the `x-istio-drain: refusable` header)
// is reset with REFUSED_STREAM; any other new stream is served as usual. New HBONE connections
// are still accepted, so peers learn the workload is draining from the GOAWAY rather than from a
// TCP refusal. The workload's outbound traffic and DNS are unaffected. Only sent if ztunnel
// advertised the DRAIN_WORKLOAD capability.
//
// Idempotent. A uid ztunnel does not know (or has not started a proxy for yet) has no connections
// to drain, and is not an error.
message DrainWorkload {
  string uid = 1;
}

// Let ztunnel know that a full snapshot was sent. Ztunnel should reconcile its internal state
// and remove internal entries that were not sent.
message SnapshotSent {
}

// Ztunnel ack message. If error is not empty, this is an error message.
message Ack {
  string error = 1;
}

/*
Protocol details:
on new connection from ztunnel to CNI, the CNI agent
- will send all the existing payloads (that it has in its cache) to the ztunnel using AddWorkload message.
- the ztunnel will send an ack for each payload (which the CNI will wait for before sending the next one).
- when the CNI finishes sending the content of its current cache, a SnapshotSent message will be sent.
- the ztunnel will then remove any entries from its cache that were not sent up to this point (as these entries do not exist in the CNI
  cache, and must have been deleted). ztunnel will ack the SnapshotSent message.
- from now on, ztunnel will expect only AddWorkload, DrainWorkload and DelWorkload messages.
- the CNI may send DrainWorkload for a workload (if ztunnel advertised DRAIN_WORKLOAD), for
  example when it starts terminating, and later sends DelWorkload once the workload is gone.
*/

// Sent from CNI to ztunnel
message WorkloadRequest {
  oneof payload {
    AddWorkload add = 1;
    KeepWorkload keep = 5;
    DelWorkload del = 2;
    SnapshotSent snapshot_sent = 3;
    DrainWorkload drain = 6;
  }
}

// Sent from ztunnel to CNI
message WorkloadResponse {
  oneof payload {
    Ack ack = 1;
  }
}
